[package]
name = "su-jian"
version = "0.1.0"
description = "素笺 - 本地 Markdown 编辑器"
authors = ["Kou"]
edition = "2021"

[lib]
name = "su_jian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-cli = "2"
serde = { version = "1", features = ["derive"] }
