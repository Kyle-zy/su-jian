<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:" />
    <title>素笺</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar__header">
          <span class="sidebar__brand">素笺</span>
          <div class="sidebar__actions">
            <button id="btn-open-folder" type="button" title="打开文件夹 (Ctrl+K)">文件夹</button>
            <button id="btn-new-file" type="button" title="新建 Markdown 文件 (Ctrl+N)">新建</button>
          </div>
        </div>
        <div id="folder-name" class="sidebar__folder-name">尚未打开文件夹</div>
        <div class="sidebar__tools">
          <button id="btn-new-folder" type="button">+ 新建文件夹</button>
        </div>
        <div id="file-tree" class="file-tree" role="tree" aria-label="文件树"></div>
        <div class="sidebar__hint">只显示 .md / .markdown / .txt</div>
      </aside>

      <main class="main">
        <header class="titlebar">
          <button id="btn-open-file" type="button" title="打开文件 (Ctrl+O)">打开文件</button>
          <span id="doc-name" class="titlebar__name">未打开文档</span>
          <span id="dirty-mark" class="titlebar__dirty" hidden title="有未保存的修改">●</span>
          <div class="titlebar__spacer"></div>
          <div class="appearance">
            <button id="btn-appearance" type="button" title="外观设置" aria-haspopup="true" aria-expanded="false">◐ 外观</button>
            <div id="appearance-menu" class="appearance-menu" hidden>
              <div class="appearance-menu__title">外观</div>
              <button type="button" data-theme-preference="system">跟随系统</button>
              <button type="button" data-theme-preference="light">亮色</button>
              <button type="button" data-theme-preference="dark">暗色</button>
            </div>
          </div>
        </header>

        <div id="editor" class="editor" aria-label="编辑区"></div>

        <footer class="statusbar">
          <span id="status-message" class="statusbar__message">就绪</span>
          <span id="status-path" class="statusbar__path"></span>
        </footer>
      </main>
    </div>

    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
